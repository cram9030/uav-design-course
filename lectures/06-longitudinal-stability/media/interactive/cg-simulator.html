<script>/* inlined: ../../../../assets/js/iframe-reveal-bridge.js */
// Include in any interactive HTML page that is embedded in a reveal.js
// slide via <iframe>. Once you click inside an iframe, the browser sends
// keyboard events to the iframe's document, so reveal.js (in the parent
// page) stops seeing arrow keys / space / a presenter clicker's
// PageUp/PageDown — the deck appears "stuck" on the interactive slide.
// This forwards those navigation keys to the parent deck's Reveal API.
//
// Keys the page itself needs (e.g. typing in an <input>) are left alone.
// Works only when the iframe is same-origin with the deck, which is
// always the case for files served alongside the slides.
(function () {
  let deck = null;
  try {
    if (window.parent !== window && window.parent.Reveal) deck = window.parent.Reveal;
  } catch (e) {
    return; // cross-origin parent: nothing we can do
  }
  if (!deck) return;
  document.documentElement.classList.add("in-reveal");

  const NEXT = new Set(["ArrowRight", "ArrowDown", "PageDown", " ", "n", "N"]);
  const PREV = new Set(["ArrowLeft", "ArrowUp", "PageUp", "p", "P"]);

  window.addEventListener("keydown", (ev) => {
    const t = ev.target;
    const editing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
    if (editing && ev.key !== "PageUp" && ev.key !== "PageDown") return;
    if (NEXT.has(ev.key)) { ev.preventDefault(); deck.next(); }
    else if (PREV.has(ev.key)) { ev.preventDefault(); deck.prev(); }
    else if (ev.key === "Escape") { ev.preventDefault(); deck.toggleOverview(); }
  });
})();

<body>
<div class="app sim">
  <div class="view" id="view">
    <svg class="stage" id="stage" viewBox="0 0 820 330" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Side view of the aircraft with a draggable center of gravity"></svg>
    <div class="badge" id="badge" aria-live="off"></div>
    <div class="flight" id="flight"></div>
    <div class="load-error" id="load-error" role="alert"></div>
  </div>

  <div class="bottom">
    <div class="ctrl">
      <h1>Pitch about the C.G.</h1>
      <div class="cg-slider">
        <label for="cg">C.G.</label>
        <input id="cg" type="range" min="-10" max="110" step="1" value="30" aria-describedby="cg-out">
        <output id="cg-out" for="cg"></output>
      </div>
      <div class="cg-slider">
        <label for="speed">Speed</label>
        <input id="speed" type="range" min="0" max="4" step="1" value="3">
        <output id="speed-out" for="speed"></output>
      </div>
      <div class="controls">
        <button class="play" id="play">&#9654; Play</button>
        <button id="reset">Reset</button>
      </div>
      <p class="status" id="status" aria-live="polite">Drag the C.G. marker, then press Play.</p>
      <div class="pitchline"><span>Pitch <i>&theta;</i></span><span class="big" id="theta-out"></span><span class="t" id="t-out"></span></div>
      <table class="readouts" aria-label="Wing and tail state">
        <thead><tr><th></th><th>Angle of attack</th><th>C<sub>L</sub></th><th>Lift</th></tr></thead>
        <tbody>
          <tr><td><span class="swatch" style="background:#2a5db0"></span>Wing</td><td id="aw-out"></td><td id="clw-out"></td><td id="lw-out"></td></tr>
          <tr><td><span class="swatch" style="background:#d9730d"></span>Tail</td><td id="at-out"></td><td id="clt-out"></td><td id="lt-out"></td></tr>
        </tbody>
      </table>
    </div>
    <div class="chart" id="chart-wing"></div>
    <div class="chart" id="chart-tail"></div>
  </div>
</div>

<script>/* inlined: ../../../../assets/js/interactive-errors.js */
// Classic (non-module) script for embedded interactives: report load
// failures ON the page instead of failing silently. A module script that
// cannot load leaves the HTML visible with nothing working and no visible
// error (this happened once; see CLAUDE.md). Expects an element with
// id="load-error"; the page's module sets window.__interactiveReady = true
// once it has started.
(function () {
  function show(msg) {
    var el = document.getElementById("load-error");
    if (el) { el.textContent = "3D view failed to start: " + msg; el.classList.add("show"); }
  }
  window.__showLoadError = show;
  window.addEventListener("error", function (e) { show(e.message || "script error"); });
  window.addEventListener("unhandledrejection", function (e) { show(String(e.reason)); });
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (!window.__interactiveReady) show("scripts did not load (if this page is the unbundled source, serve it from the repo root).");
    }, 4000);
  });
})();

</script>
<script type="module">
import { mountPitchSim } from "@bundle/lectures/06-longitudinal-stability/code/interactive/pitch-sim.js";
mountPitchSim({ mode: "cg" });
</script>
</body>
