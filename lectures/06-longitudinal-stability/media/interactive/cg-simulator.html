<script>/* inlined: ../../../../assets/js/iframe-reveal-bridge.js */
// Include in any interactive HTML page that is embedded in a reveal.js
// slide via <iframe>. Once you click inside an iframe, the browser sends
// keyboard events to the iframe's document, so reveal.js (in the parent
// page) stops seeing arrow keys / space / a presenter clicker's
// PageUp/PageDown — the deck appears "stuck" on the interactive slide.
// This forwards those navigation keys to the parent deck's Reveal API.
//
// Keys the page itself needs (e.g. typing in an <input>) are left alone.
// Works only when the iframe is same-origin with the deck, which is
// always the case for files served alongside the slides.
(function () {
  let deck = null;
  try {
    if (window.parent !== window && window.parent.Reveal) deck = window.parent.Reveal;
  } catch (e) {
    return; // cross-origin parent: nothing we can do
  }
  if (!deck) return;
  document.documentElement.classList.add("in-reveal");

  const NEXT = new Set(["ArrowRight", "ArrowDown", "PageDown", " ", "n", "N"]);
  const PREV = new Set(["ArrowLeft", "ArrowUp", "PageUp", "p", "P"]);

  window.addEventListener("keydown", (ev) => {
    const t = ev.target;
    const editing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
    if (editing && ev.key !== "PageUp" && ev.key !== "PageDown") return;
    if (NEXT.has(ev.key)) { ev.preventDefault(); deck.next(); }
    else if (PREV.has(ev.key)) { ev.preventDefault(); deck.prev(); }
    else if (ev.key === "Escape") { ev.preventDefault(); deck.toggleOverview(); }
  });
})();

      </div>
      <p class="status" id="status" aria-live="polite">Drag the C.G. marker, then press Play.</p>
      <div class="readouts" id="readouts"></div>
    </div>
    <div class="chart" id="chart-wing"></div>
    <div class="chart" id="chart-tail"></div>
  </div>
</div>

<script>/* inlined: ../../../../assets/js/interactive-errors.js */
// Classic (non-module) script for embedded interactives: report load
// failures ON the page instead of failing silently. A module script that
// cannot load leaves the HTML visible with nothing working and no visible
// error (this happened once; see CLAUDE.md). Expects an element with
// id="load-error"; the page's module sets window.__interactiveReady = true
// once it has started.
(function () {
  function show(msg) {
    var el = document.getElementById("load-error");
    if (el) { el.textContent = "3D view failed to start: " + msg; el.classList.add("show"); }
  }
  window.__showLoadError = show;
  window.addEventListener("error", function (e) { show(e.message || "script error"); });
  window.addEventListener("unhandledrejection", function (e) { show(String(e.reason)); });
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (!window.__interactiveReady) show("scripts did not load (if this page is the unbundled source, serve it from the repo root).");
    }, 4000);
  });
})();

</script>
<script type="module">
import { jetProfile, GEOM } from "@bundle/assets/js/aircraft2d/jet-profile.js";
import { P, pitch, step, clWing, clTail, cgX, LIMITS, D2R } from "@bundle/lectures/06-longitudinal-stability/code/interactive/pitch-model.js";

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};
const CSSVAR = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (v, d = 1) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);

// ---- stage layout -----------------------------------------------------------
// Nose LEFT, free stream left -> right. screen = (X0 - s*x, Y0 - s*y).
const s = 40, X0 = 420, Y0 = 212;
const toScreen = (x, y) => [X0 - s * x, Y0 - s * y];
const stage = document.getElementById("stage");

// Free-stream arrows (fixed; the air does not rotate with the aircraft).
const defs = el("defs", {}, stage);
const mkHead = (id, color) => {
  const m = el("marker", { id, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", fill: color }, m);
};
mkHead("h-wind", "#6f8fb0"); mkHead("h-wing", "#2a5db0"); mkHead("h-tail", "#d9730d"); mkHead("h-moment", "#1f2a36");
const wind = el("g", {}, stage);
for (const y of [90, 145, 200, 255]) el("line", { x1: 6, y1: y, x2: 62, y2: y, stroke: "#6f8fb0", "stroke-width": 2.5, "marker-end": "url(#h-wind)" }, wind);
const wl = el("text", { x: 6, y: 72, "font-size": 15 }, wind);
wl.innerHTML = '<tspan class="sym">V</tspan><tspan dy="4" font-size="11">&#8734;</tspan><tspan dy="-4"> = 65 m/s</tspan>';

// Aircraft group: rotates about the C.G. by theta (SVG rotate is clockwise
// on screen = nose UP for a nose-left aircraft).
const craft = el("g", { id: "craft" }, stage);
const body = el("g", { transform: `translate(${X0} ${Y0}) scale(${-s} ${-s})` }, craft);
for (const part of jetProfile()) {
  el("path", { d: part.d, class: { body: "skin", glass: "glass", section: "section", engine: "engine" }[part.role], "vector-effect": "non-scaling-stroke" }, body);
}

// Mean aerodynamic chord bar with % ticks, under the wing.
const mac = el("g", { class: "mac" }, craft);
const [macL, macY] = toScreen(GEOM.mac.le, -1.25);
const [macR] = toScreen(GEOM.mac.le - GEOM.mac.chord, -1.25);
el("line", { x1: macL, y1: macY, x2: macR, y2: macY }, mac);
for (const pct of [0, 25, 50, 75, 100]) {
  const [x] = toScreen(cgX(pct / 100), 0);
  el("line", { x1: x, y1: macY - 4, x2: x, y2: macY + 4 }, mac);
  if (pct === 0 || pct === 100) el("text", { x, y: macY + 16, "text-anchor": "middle" }, mac).textContent = pct + "%";
}
el("text", { x: macR + 8, y: macY + 4 }, mac).textContent = "MAC";

// Aerodynamic-center dots (where the lift arrows attach).
const [awx, awy] = toScreen(GEOM.wingAC.x, GEOM.wingAC.y);
const [atx, aty] = toScreen(GEOM.tailAC.x, GEOM.tailAC.y);
el("circle", { cx: awx, cy: awy, r: 3.5, fill: "#2a5db0" }, craft);
el("circle", { cx: atx, cy: aty, r: 3.5, fill: "#d9730d" }, craft);

// C.G. marker (quartered disc) + guide line + label; draggable.
const cgG = el("g", { class: "cg-handle", tabindex: -1 }, craft);
el("line", { x1: 0, y1: -40, x2: 0, y2: 44, stroke: "#1f2a36", "stroke-dasharray": "4 3", "stroke-width": 1 }, cgG);
el("circle", { r: 24, fill: "transparent" }, cgG);                    // generous hit target
el("circle", { r: 10, fill: "#fff", stroke: "#111", "stroke-width": 1.5 }, cgG);
el("path", { d: "M0,0 L10,0 A10,10 0 0,1 0,10 Z M0,0 L-10,0 A10,10 0 0,1 0,-10 Z", fill: "#111" }, cgG);
const cgLab = el("text", { y: -46, "text-anchor": "middle", "font-size": 13, "font-weight": 600 }, cgG);

// Dynamic overlays (screen space, not rotated with the aircraft).
const overlay = el("g", {}, stage);
const liftW = el("line", { stroke: "#2a5db0", "stroke-width": 3, "marker-end": "url(#h-wing)" }, overlay);
const liftT = el("line", { stroke: "#d9730d", "stroke-width": 3, "marker-end": "url(#h-tail)" }, overlay);
const liftWLab = el("text", { "font-size": 13, "text-anchor": "end" }, overlay);
const liftTLab = el("text", { "font-size": 13, "text-anchor": "end" }, overlay);
const mArc = el("path", { fill: "none", stroke: "#1f2a36", "stroke-width": 3, "marker-end": "url(#h-moment)" }, overlay);
const badge = document.getElementById("badge");

// ---- lift-curve charts ------------------------------------------------------
function makeChart(host, { title, color, fn, xmin, xmax, ymin, ymax, xlabel, xticks, yticks }) {
  const W = 360, H = 168, L = 34, R = 8, T = 22, B = 26;
  const sx = (a) => L + ((a - xmin) / (xmax - xmin)) * (W - L - R);
  const sy = (c) => T + ((ymax - c) / (ymax - ymin)) * (H - T - B);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": title }, host);
  el("text", { x: L, y: 14, class: "title" }, svg).innerHTML = title;
  const g = el("g", { class: "grid" }, svg);
  for (const y of yticks) el("line", { x1: L, x2: W - R, y1: sy(y), y2: sy(y) }, g);
  const ax = el("g", { class: "axis" }, svg);
  el("line", { x1: L, x2: W - R, y1: sy(0), y2: sy(0) }, ax);
  el("line", { x1: sx(0), x2: sx(0), y1: T, y2: H - B }, ax);
  for (const y of yticks) el("text", { x: L - 4, y: sy(y) + 3.5, "text-anchor": "end" }, svg).textContent = y;
  for (const x of xticks) el("text", { x: sx(x), y: H - B + 12, "text-anchor": "middle" }, svg).textContent = x + "°";
  el("text", { x: W - R, y: H - 3, "text-anchor": "end" }, svg).innerHTML = xlabel;
  el("text", { x: 4, y: T + 4 }, svg).innerHTML = 'C<tspan baseline-shift="sub" font-size="8">L</tspan>';
  let d = "";
  for (let i = 0; i <= 200; i++) {
    const a = xmin + ((xmax - xmin) * i) / 200;
    d += (i ? "L" : "M") + sx(a).toFixed(1) + "," + sy(fn(a * D2R)).toFixed(1);
  }
  el("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  const marker = el("circle", { r: 5.5, fill: color, stroke: "#fff", "stroke-width": 2 }, svg);
  // Hover crosshair + readout (pointer anywhere over the plot).
  const tip = el("g", { class: "tip", visibility: "hidden" }, svg);
  const vline = el("line", { y1: T, y2: H - B, stroke: "#9aa7b5", "stroke-dasharray": "3 3" }, tip);
  const tdot = el("circle", { r: 3.5, fill: color }, tip);
  const tbox = el("rect", { rx: 4, height: 18, width: 104 }, tip);
  const ttxt = el("text", {}, tip);
  const hit = el("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", (ev) => {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const a = xmin + ((p.x - L) / (W - L - R)) * (xmax - xmin);
    const c = fn(a * D2R);
    vline.setAttribute("x1", sx(a)); vline.setAttribute("x2", sx(a));
    tdot.setAttribute("cx", sx(a)); tdot.setAttribute("cy", sy(c));
    const bx = Math.min(sx(a) + 6, W - R - 104);
    tbox.setAttribute("x", bx); tbox.setAttribute("y", T);
    ttxt.setAttribute("x", bx + 6); ttxt.setAttribute("y", T + 13);
    ttxt.innerHTML = `${a.toFixed(1)}° → C<tspan baseline-shift="sub" font-size="8">L</tspan> ${c.toFixed(2)}`;
    tip.setAttribute("visibility", "visible");
  });
  hit.addEventListener("pointerleave", () => tip.setAttribute("visibility", "hidden"));
  return (alphaDeg, cl) => {
    const a = Math.max(xmin, Math.min(xmax, alphaDeg));
    marker.setAttribute("cx", sx(a)); marker.setAttribute("cy", sy(cl));
  };
}
const updWing = makeChart(document.getElementById("chart-wing"), {
  title: 'Wing (NACA 4412): C<tspan baseline-shift="sub" font-size="9">L</tspan> vs α', color: "#2a5db0", fn: clWing,
  xmin: -10, xmax: 25, ymin: -1, ymax: 1.8, xticks: [-10, 0, 10, 20], yticks: [-1, 0, 1], xlabel: "α",
});
const updTail = makeChart(document.getElementById("chart-tail"), {
  title: 'Tail (NACA 0012): C<tspan baseline-shift="sub" font-size="9">L</tspan> vs α<tspan baseline-shift="sub" font-size="9">t</tspan>', color: "#d9730d", fn: clTail,
  xmin: -20, xmax: 20, ymin: -1.4, ymax: 1.4, xticks: [-20, -10, 0, 10, 20], yticks: [-1, 0, 1], xlabel: 'α<tspan baseline-shift="sub" font-size="8">t</tspan>',
});

// ---- flight-condition strip ---------------------------------------------
document.getElementById("flight").innerHTML =
  `<b>V</b> ${P.V} m/s · <b>&rho;</b> ${P.rho} kg/m³ · <b>Re</b> ${(P.ReW / 1e6).toFixed(1)}×10⁶ wing, ${(P.ReT / 1e6).toFixed(1)}×10⁶ tail · ` +
  `<b>S</b> ${P.S} m² · <b>S<sub>t</sub></b> ${P.St.toFixed(2)} m² · <b>c̄</b> ${P.cbar} m · <b>l<sub>t</sub></b> ${P.lt.toFixed(1)} m`;

// ---- state + drawing ------------------------------------------------------------
const cgInput = document.getElementById("cg");
const state = { h: 0.30, sim: { theta: 0, q: 0, t: 0 }, running: false, ran: false };

function rotateAbout(x, y, cx, cy, a) {
  const c = Math.cos(a), si = Math.sin(a);
  return [cx + (x - cx) * c - (y - cy) * si, cy + (x - cx) * si + (y - cy) * c];
}

function draw() {
  const { h, sim } = state;
  const [cx, cy] = toScreen(cgX(h), 0);
  cgG.setAttribute("transform", `translate(${cx} ${cy})`);
  cgLab.textContent = `C.G. ${Math.round(h * 100)}% MAC`;
  cgLab.setAttribute("visibility", state.ran ? "hidden" : "visible");
  document.getElementById("cg-out").textContent = `${Math.round(h * 100)}%`;
  craft.setAttribute("transform", `rotate(${sim.theta / D2R} ${cx} ${cy})`);

  const r = pitch(sim.theta, sim.q, h);
  updWing(r.alphaW / D2R, r.CLw);
  updTail(r.alphaT / D2R, r.CLt);

  // Forces/moment only once the run has started (the notes: Play reveals them).
  const show = state.ran;
  for (const n of [liftW, liftT, liftWLab, liftTLab, mArc]) n.setAttribute("visibility", show ? "visible" : "hidden");
  badge.style.visibility = show ? "visible" : "hidden";
  if (show) {
    const kpx = 2.2; // px per kN
    const [wx, wy] = rotateAbout(awx, awy, cx, cy, sim.theta);
    const [tx, ty] = rotateAbout(atx, aty, cx, cy, sim.theta);
    const lw = (r.Lw / 1000) * kpx, lt = (r.Lt / 1000) * kpx;
    liftW.setAttribute("x1", wx); liftW.setAttribute("y1", wy); liftW.setAttribute("x2", wx); liftW.setAttribute("y2", wy - lw);
    liftT.setAttribute("x1", tx); liftT.setAttribute("y1", ty); liftT.setAttribute("x2", tx); liftT.setAttribute("y2", ty - lt);
    liftT.setAttribute("visibility", Math.abs(lt) < 2 ? "hidden" : "visible");
    liftWLab.setAttribute("x", wx - 8); liftWLab.setAttribute("y", wy - lw / 2);
    liftWLab.innerHTML = `<tspan class="sym">L</tspan><tspan dy="3" font-size="10">w</tspan><tspan dy="-3"> ${(r.Lw / 1000).toFixed(1)} kN</tspan>`;
    liftTLab.setAttribute("x", tx - 8); liftTLab.setAttribute("y", ty - lt / 2 + (lt >= 0 ? 0 : 12));
    liftTLab.innerHTML = `<tspan class="sym">L</tspan><tspan dy="3" font-size="10">t</tspan><tspan dy="-3"> ${(r.Lt / 1000).toFixed(1)} kN</tspan>`;
    // Moment arc around the C.G.: sweep ~ |M|; clockwise on screen = nose up.
    const Mk = r.M / 1000;
    const sweep = Math.min(300, Math.max(35, (Math.abs(Mk) / 12) * 300)) * D2R;
    const R = 30, a0 = -Math.PI / 2 - (Mk >= 0 ? 0.6 : -0.6);
    const dir = Mk >= 0 ? 1 : -1;
    const a1 = a0 + dir * sweep;
    const p0 = [cx + R * Math.cos(a0), cy + R * Math.sin(a0)];
    const p1 = [cx + R * Math.cos(a1), cy + R * Math.sin(a1)];
    mArc.setAttribute("d", `M${p0[0]},${p0[1]} A${R},${R} 0 ${sweep > Math.PI ? 1 : 0},${dir > 0 ? 1 : 0} ${p1[0]},${p1[1]}`);
    mArc.setAttribute("visibility", Math.abs(Mk) < 0.05 ? "hidden" : "visible");
    badge.innerHTML = `<i>M</i><sub>c.g.</sub> = ${fmt(Mk)} kN·m <span style="font-weight:400">${Mk >= 0 ? "nose up ↻" : "nose down ↺"}</span>`;
  }

  const sw = (c) => `<span class="swatch" style="background:${c}"></span>`;
  document.getElementById("readouts").innerHTML = `
    <span class="h"></span><span class="h">Angle</span><span class="h">Lift</span>
    <span>Pitch &theta;</span><span class="big">${fmt(sim.theta / D2R)}°</span><span>t = ${sim.t.toFixed(1)} s</span>
    <span>${sw("#2a5db0")}Wing</span><span>&alpha; ${fmt(r.alphaW / D2R)}°</span><span>C<sub>L</sub> ${r.CLw.toFixed(2)} · ${(r.Lw / 1000).toFixed(1)} kN</span>
    <span>${sw("#d9730d")}Tail</span><span>&alpha;<sub>t</sub> ${fmt(r.alphaT / D2R)}°</span><span>C<sub>L</sub> ${r.CLt.toFixed(2)} · ${(r.Lt / 1000).toFixed(1)} kN</span>
    `;
}

// ---- C.G. dragging (and the slider, for keyboard / small screens) ---------
function setH(h) {
  if (state.running) return;
  state.h = Math.max(-0.1, Math.min(1.1, h));
  cgInput.value = Math.round(state.h * 100);
  if (state.ran) reset(); else draw();
}
cgInput.addEventListener("input", () => setH(cgInput.value / 100));
let dragging = false;
cgG.addEventListener("pointerdown", (ev) => {
  if (state.running) return;
  if (state.ran) reset();
  dragging = true;
  cgG.setPointerCapture(ev.pointerId);
});
cgG.addEventListener("pointermove", (ev) => {
  if (!dragging) return;
  const pt = stage.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(stage.getScreenCTM().inverse());
  setH((GEOM.mac.le - (X0 - p.x) / s) / GEOM.mac.chord);
});
const endDrag = () => { dragging = false; };
cgG.addEventListener("pointerup", endDrag);
cgG.addEventListener("pointercancel", endDrag);

// ---- simulation loop --------------------------------------------------------
const playBtn = document.getElementById("play");
const status = document.getElementById("status");
const DT = 1 / 240;
let last = 0, acc = 0;

function reset() {
  state.running = false; state.ran = false;
  state.sim = { theta: 0, q: 0, t: 0 };
  document.body.classList.remove("playing");
  playBtn.disabled = false; cgInput.disabled = false;
  status.textContent = "Drag the C.G. marker, then press Play.";
  draw();
}

function finish(msg) {
  state.running = false;
  document.body.classList.remove("playing");
  playBtn.disabled = false; cgInput.disabled = false;
  status.textContent = msg;
}

function frame(now) {
  if (!state.running) return;
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (acc >= DT) {
    state.sim = step(state.sim, DT, state.h);
    acc -= DT;
    if (Math.abs(state.sim.theta) >= LIMITS.thetaMax) {
      state.sim.theta = Math.sign(state.sim.theta) * LIMITS.thetaMax;
      draw();
      return finish(`Reached 20° nose ${state.sim.theta > 0 ? "up" : "down"} after ${state.sim.t.toFixed(1)} s.`);
    }
    if (state.sim.t >= LIMITS.tMax) {
      draw();
      const settled = Math.abs(state.sim.q) < 0.2 * D2R;
      return finish(settled
        ? `Settled at θ = ${fmt(state.sim.theta / D2R)}° (time limit ${LIMITS.tMax} s).`
        : `Still oscillating at ${LIMITS.tMax} s (θ = ${fmt(state.sim.theta / D2R)}°).`);
    }
  }
  draw();
  requestAnimationFrame(frame);
}

playBtn.addEventListener("click", () => {
  if (state.ran) { state.sim = { theta: 0, q: 0, t: 0 }; }
  state.running = true; state.ran = true;
  document.body.classList.add("playing");
  playBtn.disabled = true; cgInput.disabled = true;
  status.textContent = "Running…";
  last = performance.now(); acc = 0;
  requestAnimationFrame(frame);
});
document.getElementById("reset").addEventListener("click", reset);

// Test hook: lets automated checks drive the simulator deterministically.
window.__cgSim = { state, setH, reset };

reset();
window.__interactiveReady = true;
</script>
</body>
</html>
