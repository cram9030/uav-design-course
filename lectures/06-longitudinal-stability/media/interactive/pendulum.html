<script type="module">
import { el, label, sym, clamp01, ease } from "@bundle/assets/js/aircraft2d/svg-draw.js";

const MODE = new URLSearchParams(location.search).get("mode") === "inverted" ? "inverted" : "stable";
const THETA0 = MODE === "inverted" ? Math.PI : 0;

// ---- physics: theta'' = -(g/L) sin(theta) - c theta' ------------------------
const g = 9.81, Lm = 1.0, c = 1.0;
const POKE_RATE = MODE === "inverted" ? 0.6 : 2.2;      // theta-dot given by the tap [rad/s]
const f = (th, w) => [w, -(g / Lm) * Math.sin(th) - c * w];
function rk4(s, dt) {
  const [a1, b1] = f(s.th, s.w);
  const [a2, b2] = f(s.th + 0.5 * dt * a1, s.w + 0.5 * dt * b1);
  const [a3, b3] = f(s.th + 0.5 * dt * a2, s.w + 0.5 * dt * b2);
  const [a4, b4] = f(s.th + dt * a3, s.w + dt * b3);
  return { th: s.th + (dt / 6) * (a1 + 2 * a2 + 2 * a3 + a4), w: s.w + (dt / 6) * (b1 + 2 * b2 + 2 * b3 + b4), t: s.t + dt };
}

// ---- drawing ------------------------------------------------------------------
// theta measured from straight down, positive counter-clockwise on screen
// (bob swings to the LEFT for positive theta).
const stage = document.getElementById("stage");
// Stable mode crops to the hanging half; inverted needs the full circle.
if (MODE === "stable") stage.setAttribute("viewBox", "0 150 500 310");
const PX = 250, PY = 215, R = 150, BOB = 20;
const bobPos = (th) => [PX - R * Math.sin(th), PY + R * Math.cos(th)];
el("line", { x1: PX, y1: PY - R - 30, x2: PX, y2: PY + R + 30, stroke: "#b8c2cc", "stroke-dasharray": "5 5" }, stage);
const thetaArc = el("path", { fill: "none", stroke: "#e07b00", "stroke-width": 2.5 }, stage);
const thetaLab = label(stage, { size: 20, color: "#b35f00" });
const rod = el("line", { stroke: "#3d4b59", "stroke-width": 5, "stroke-linecap": "round" }, stage);
el("rect", { x: PX - 34, y: PY - 7, width: 68, height: 14, rx: 3, fill: "#5a6b7d" }, stage);   // mount
el("circle", { cx: PX, cy: PY, r: 6, fill: "#1f2a36" }, stage);
const bob = el("circle", { r: BOB, fill: "#2a5db0", stroke: "#173a75", "stroke-width": 2 }, stage);

// Clip-art pointing hand (index finger pointing LEFT), drawn around its fingertip at (0, 0).
const hand = el("g", {}, stage);
const SKIN = "#f2c29b", LINE = "#8a5a3c";
el("rect", { x: 118, y: -30, width: 22, height: 64, rx: 4, fill: "#2a5db0", stroke: "#173a75", "stroke-width": 2 }, hand);   // cuff
el("rect", { x: 56, y: -24, width: 66, height: 56, rx: 16, fill: SKIN, stroke: LINE, "stroke-width": 2 }, hand);            // palm
for (const [y, w] of [[2, 28], [14, 26], [25, 22]])                                                                         // folded fingers
  el("rect", { x: 56 - w + 12, y, width: w, height: 11, rx: 5.5, fill: SKIN, stroke: LINE, "stroke-width": 2 }, hand);
el("rect", { x: 0, y: -10, width: 76, height: 18, rx: 9, fill: SKIN, stroke: LINE, "stroke-width": 2 }, hand);             // index finger
el("path", { d: "M70,-22 q18,-14 34,-4", fill: "none", stroke: LINE, "stroke-width": 2 }, hand);                            // thumb crease
el("ellipse", { cx: 9, cy: -1, rx: 4, ry: 6, fill: "#f7d9c2" }, hand);                                                     // nail

const readout = el("text", { x: 250, y: 440, "text-anchor": "middle", class: "readout" }, stage);
const note = el("text", { x: 250, y: MODE === "stable" ? 408 : 30, "text-anchor": "middle", class: "note" }, stage);

function wrap(th) { let a = ((th + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a; }

function draw(th, handProgress) {
  const [bx, by] = bobPos(th);
  rod.setAttribute("x1", PX); rod.setAttribute("y1", PY); rod.setAttribute("x2", bx); rod.setAttribute("y2", by);
  bob.setAttribute("cx", bx); bob.setAttribute("cy", by);
  // theta arc from straight down to the rod.
  const a = wrap(th), r = 56;
  if (Math.abs(a) > 0.02) {
    const p0 = [PX, PY + r], p1 = [PX - r * Math.sin(a), PY + r * Math.cos(a)];
    thetaArc.setAttribute("d", `M${p0[0]},${p0[1]} A${r},${r} 0 ${Math.abs(a) > Math.PI ? 1 : 0},${a > 0 ? 1 : 0} ${p1[0]},${p1[1]}`);
    thetaArc.setAttribute("visibility", "visible");
    const mid = a / 2;
    thetaLab.update(PX - (r + 18) * Math.sin(mid) - 6, PY + (r + 18) * Math.cos(mid) + 6, sym("θ"));
    thetaLab.setAttribute("visibility", "visible");
  } else { thetaArc.setAttribute("visibility", "hidden"); thetaLab.setAttribute("visibility", "hidden"); }
  // Hand: slides in from the right to the bob's start position, then away.
  const [rx, ry] = bobPos(THETA0);
  const hx = rx + BOB + 2 + (1 - handProgress) * 220;
  hand.setAttribute("transform", `translate(${hx} ${ry - 1})`);
  hand.setAttribute("opacity", handProgress > 0.001 ? 1 : 0);
  const deg = (a * 180) / Math.PI;
  readout.textContent = `θ = ${a >= 0 ? "" : "−"}${Math.abs(a).toFixed(2)} rad  (${a >= 0 ? "" : "−"}${Math.abs(deg).toFixed(1)}°)`;
}

// ---- timeline -------------------------------------------------------------------
// Phase "in" (finger approaches, 0.6 s) -> contact: impulse -> "out" (finger
// withdraws, 0.5 s) while the pendulum swings -> settles.
const DT = 1 / 240;
let state = { th: THETA0, w: 0, t: 0 }, phase = "rest", phaseT = 0, last = 0, raf = 0;
function settled(s) { return s.t > 3 && Math.abs(s.w) < 0.01 && Math.abs(Math.sin(s.th)) < 0.004; }
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  phaseT += dt;
  let handP = 0;
  if (phase === "in") {
    handP = ease(clamp01(phaseT / 0.6));
    if (phaseT >= 0.6) { phase = "swing"; phaseT = 0; state.w = POKE_RATE; }    // contact: the tap
  }
  if (phase === "swing") {
    handP = 1 - ease(clamp01(phaseT / 0.5));
    for (let k = 0; k < Math.round(dt / DT); k++) state = rk4(state, DT);
    if (settled(state)) {
      // Snap the last fraction of a degree so the readout ends exactly at the equilibrium.
      phase = "done"; state.th = Math.round(state.th / (2 * Math.PI)) * 2 * Math.PI; state.w = 0;
      note.textContent = MODE === "stable" ? "Back at equilibrium, θ = 0" : "";
    }
  }
  draw(state.th, handP);
  if (phase === "in" || phase === "swing") raf = requestAnimationFrame(frame);
}
function reset() {
  cancelAnimationFrame(raf);
  state = { th: THETA0, w: 0, t: 0 }; phase = "rest"; phaseT = 0; note.textContent = "";
  draw(state.th, 0);
}
function settledState() {
  cancelAnimationFrame(raf);
  // Entered at step 1 (e.g. stepping back into the slide): show the outcome.
  state = { th: MODE === "inverted" ? 0 : 0, w: 0, t: 99 }; phase = "done";
  note.textContent = MODE === "stable" ? "Back at equilibrium, θ = 0" : "";
  draw(state.th, 0);
}

window.onRevealStep((step, { instant }) => {
  if (step <= 0) return reset();
  if (instant) return settledState();
  if (phase === "rest") { phase = "in"; phaseT = 0; last = performance.now(); raf = requestAnimationFrame(frame); }
});
window.__pendulum = { get: () => ({ ...state, phase }) };
reset();
window.__interactiveReady = true;
</script>
</body>
</html>
