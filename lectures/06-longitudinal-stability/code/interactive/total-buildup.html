<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculating Total Pitching Moment</title>
<!-- SOURCE for lectures/06-longitudinal-stability/media/interactive/total-buildup.html.
     Lecture 06, "Calculating Total Pitching Moment": the aircraft from the
     wing and tail slides, gaining its force vectors in step with the
     equation substitution (shared scaffolding: force-diagram.js / .css).
       step 0  aircraft + c.g. + total moment M_c.g. (M_cg = M_cg,w + M_cg,t)
       step 1  M_c.g. removed; wing forces L, D, M_ac, T (wing terms substituted)
       step 2  tail forces L_t, D_t        (tail terms substituted)
     Moment-arm dimensions are left off here (each was shown on its own
     slide) to keep the full force system readable. Standalone: arrow keys
     or ?step=N.
     After editing, rebuild the self-contained copy the slide embeds:
       uv run python scripts/bundle_interactive.py \
         lectures/06-longitudinal-stability/code/interactive/total-buildup.html \
         lectures/06-longitudinal-stability/media/interactive/total-buildup.html -->
<script src="../../../../assets/js/anim-steps.js"></script>
<link rel="stylesheet" href="./force-diagram.css">
</head>
<body>
<svg id="stage" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="All wing and tail forces on the aircraft side view"></svg>
<script src="../../../../assets/js/interactive-errors.js"></script>
<script type="module">
import { vector, momentArc, label, sym, ease, clamp01 } from "../../../../assets/js/aircraft2d/svg-draw.js";
import { createDiagram, runSteps, op, COLORS as C } from "./force-diagram.js";

// Same aircraft, scale and relative wind as the wing / tail slides.
const dg = createDiagram({ Y0: 290, wind: { x: 24, y: 388, len: 130 }, engine: "show",
                           highlight: { flap: true, elevator: true } });
const { fx, CG, AC, TAC, uL, uD, toS } = dg;

const L0 = 112, D0 = 52, T0 = 76, Lt0 = 62, Dt0 = 40;
const THR = toS(-0.61, 0.146);                        // nacelle intake on the thrust line

const vL = vector(fx, { color: C.L }), vD = vector(fx, { color: C.D }), vT = vector(fx, { color: C.T });
const mAC = momentArc(fx, { color: C.M });
const vLt = vector(fx, { color: C.L }), vDt = vector(fx, { color: C.D });
const lL = label(fx), lD = label(fx), lT = label(fx), lM = label(fx), lLt = label(fx), lDt = label(fx);
const lCG = label(fx, { size: 15 });
// Total moment about the c.g., shown before the equation is expanded:
// drawn positive (nose up = clockwise on screen for this nose-left view).
const mCG = momentArc(fx, { color: C.M, width: 3.4, head: 13 });
const lMcg = label(fx, { size: 19 });
dg.drawCG();
lCG.update(CG[0] + 14, CG[1] + 6, "c.g.");

function render(pos) {
  const f1 = ease(clamp01(pos)), f2 = ease(clamp01(pos - 1));
  // Total moment (step 0 only): fades out as the wing terms come in.
  mCG.update(CG[0], CG[1], 34, -0.95 * Math.PI, 1.5 * Math.PI); op(mCG, 1 - f1);
  lMcg.update(CG[0] - 36, CG[1] - 44, sym("M", "c.g.")); op(lMcg, 1 - f1);
  // Wing group (step 1).
  vL.update(AC[0], AC[1], uL[0], uL[1], L0 * f1); op(vL, f1);
  lL.update(AC[0] + uL[0] * L0 * f1 - 26, AC[1] + uL[1] * L0 * f1 + 6, sym("L")); op(lL, f1);
  vD.update(AC[0], AC[1], uD[0], uD[1], D0 * f1); op(vD, f1);
  lD.update(AC[0] + uD[0] * D0 * f1 + 8, AC[1] + uD[1] * D0 * f1 + 6, sym("D")); op(lD, f1);
  mAC.update(AC[0], AC[1], 24, -0.15 * Math.PI, -1.45 * Math.PI * f1); op(mAC, f1);
  lM.update(AC[0] - 64, AC[1] + 30, sym("M", "ac")); op(lM, f1);
  vT.update(THR[0], THR[1], -1, 0, T0 * f1); op(vT, f1);
  lT.update(THR[0] - T0 * f1 * 0.62, THR[1] - 9, sym("T")); op(lT, f1);
  // Tail group (step 2).
  vLt.update(TAC[0], TAC[1], uL[0], uL[1], Lt0 * f2); op(vLt, f2);
  lLt.update(TAC[0] + uL[0] * Lt0 * f2 - 30, TAC[1] + uL[1] * Lt0 * f2 + 8, sym("L", "t")); op(lLt, f2);
  vDt.update(TAC[0], TAC[1], uD[0], uD[1], Dt0 * f2); op(vDt, f2);
  lDt.update(TAC[0] + uD[0] * Dt0 * f2 + 6, TAC[1] + uD[1] * Dt0 * f2 + 18, sym("D", "t")); op(lDt, f2);
}

runSteps(render, 2);
</script>
</body>
</html>
