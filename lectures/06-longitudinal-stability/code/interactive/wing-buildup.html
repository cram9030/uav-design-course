<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wing Contribution to Longitudinal Forces</title>
<!-- SOURCE for lectures/06-longitudinal-stability/media/interactive/wing-buildup.html.
     Lecture 06, "Wing Contribution to Longitudinal Forces": fragment-driven
     force build-up on the traced HondaJet side profile. The deck tells it
     the current step (assets/html/reveal-anim-steps.html ->
     assets/js/anim-steps.js); standalone, step with the arrow keys or ?step=N.
       step 1  C.G. + weight W
       step 2  lift L (perpendicular to the relative wind)
       step 3  L projected on the vertical, equal & opposite to W; callout
       step 4  callout, projection and W removed; moment arm d_c.g.,L
       step 5  drag D (along the relative wind) + d_c.g.,D
       step 6  pitching moment about the wing a.c., M_ac
       step 7  engine appears, thrust T + d_c.g.,T
       step 8  flap deflects; old L, D fade; larger, slightly rotated L, D;
               L_delta_f drawn tip to tip
       step 9  callout: "What are some changes that could be made to the
               wing moment model?"
       step 10 that callout replaced by one on thrust vs. drag
               (D_total = T; the drawn D is the induced drag)
     After editing, rebuild the self-contained copy the slide embeds:
       uv run python scripts/bundle_interactive.py \
         lectures/06-longitudinal-stability/code/interactive/wing-buildup.html \
         lectures/06-longitudinal-stability/media/interactive/wing-buildup.html -->
<script src="../../../../assets/js/anim-steps.js"></script>
<link rel="stylesheet" href="./force-diagram.css">
</head>
<body>
<svg id="stage" viewBox="0 0 1000 330" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Wing force build-up on the aircraft side view"></svg>
<script src="../../../../assets/js/interactive-errors.js"></script>
<script type="module">
import { GEOM } from "../../../../assets/js/aircraft2d/jet-profile.js";
import { vector, momentArc, label, sym, sub, dimension, ease, clamp01, el } from "../../../../assets/js/aircraft2d/svg-draw.js";
import { createDiagram, runSteps, foot, rot, op, D2R, COLORS as C } from "./force-diagram.js";

// Whole 12.5 m aircraft across the frame (78 px/m); schematic C.G. at 55% MAC.
const dg = createDiagram({ engine: "fade", highlight: { flap: true, elevator: false } });
const { stage, toS, ALPHA, fx, dims, CG, AC, uL, uD, engineG, flapG } = dg;
const GHOST = C.ghost;

// ---- force elements --------------------------------------------------------------
const L0 = 112, D0 = 52, T0 = 76;
const THR = toS(-0.61, 0.146);                            // nacelle intake on the thrust line

const projV = vector(fx, { color: C.L, width: 2.2, dash: "6 4", head: 11 });
const projH = el("line", { stroke: C.L, "stroke-width": 1.4, "stroke-dasharray": "3 3" }, fx);
const vW = vector(fx, { color: C.W });
const vL = vector(fx, { color: C.L });
const vD = vector(fx, { color: C.D });
const vT = vector(fx, { color: C.T });
// Gray copies of the original L and D, cross-faded in at the flap step.
const vLg = vector(fx, { color: GHOST }), vDg = vector(fx, { color: GHOST });
const vL2 = vector(fx, { color: C.L });
const vD2 = vector(fx, { color: C.D });
const vLd = vector(fx, { color: C.Ld, width: 2.6, head: 11 });
const mAC = momentArc(fx, { color: C.M });
const lW = label(fx), lL = label(fx), lD = label(fx), lT = label(fx), lM = label(fx), lL2 = label(fx), lD2 = label(fx), lLd = label(fx), lCG = label(fx, { size: 15 });
const dL = dimension(dims, { anchor: "end" }), dD = dimension(dims), dT = dimension(dims);

// C.G. symbol (above the weight vector that starts at it).
const cgG = dg.drawCG();

// Callout (verbatim from the outline).
const callout = el("g", { class: "callout" }, stage);
el("rect", { x: 650, y: 256, width: 330, height: 62, rx: 10 }, callout);
el("text", { x: 666, y: 281 }, callout).textContent = "Assume Lift is equal to Weight";
el("text", { x: 666, y: 305 }, callout).textContent = "and we are in steady flight";

// Discussion callouts after the build-up (steps 9, 10), same style, top
// left over the nose, clear of the lift arrow. Lines are markup (sym() for
// math); { eq } lines are centred and set larger.
function noteBox(lines, x = 8, y = 6, w = 396) {
  const g = el("g", { class: "callout" }, stage);
  const box = el("rect", { x, y, width: w, rx: 10 }, g);
  let ty = y + 25;
  for (const ln of lines) {
    const eq = typeof ln === "object";
    const t = el("text", eq ? { x: x + w / 2, y: ty + 3, "text-anchor": "middle", "font-size": 21 } : { x: x + 16, y: ty }, g);
    t.innerHTML = eq ? ln.eq : ln;
    ty += eq ? 29 : 23;
  }
  box.setAttribute("height", ty - y - 9);
  return g;
}
const note1 = noteBox([
  "What are some changes that could be made",
  "to the wing moment model?",
]);
const note2 = noteBox([
  `Thrust ${sym("T")} is not necessarily independent of ${sym("D")}`,
  `and therefore ${sym("α")} or ${sym("δ", "f").replace("> </tspan>", "></tspan>")}. In order to maintain`,
  "a constant velocity:",
  { eq: `${sym("D", "total")} = ${sym("T")}` },
  `and what is labeled ${sym("D")} in the diagram is the`,
  "induced drag, which is a component of the",
  "total drag.",
]);


// ---- render a continuous build position --------------------------------------------
// f(k): how far step k has been reached (0..1, eased); steps can play
// forward or backward because everything is a function of `pos`.
function render(pos) {
  const f = (k) => ease(clamp01(pos - (k - 1)));
  const f1 = f(1), f2 = f(2), f3 = f(3), f4 = f(4), f5 = f(5), f6 = f(6), f7 = f(7), f8 = f(8), f9 = f(9), f10 = f(10);

  // Weight and C.G. (removed at step 4).
  const wVis = f1 * (1 - f4);
  // "c.g." sits right of the symbol, below the thrust line (step 7), which
  // runs just above the C.G.
  op(cgG, f1); lCG.update(CG[0] + 14, CG[1] + 6, "c.g."); op(lCG, f1);
  vW.update(CG[0], CG[1], 0, 1, L0 * Math.cos(ALPHA) * f1); op(vW, wVis);
  lW.update(CG[0] + 10, CG[1] + L0 * Math.cos(ALPHA) * 0.75, sym("W")); op(lW, wVis);

  // Lift (step 2). At the flap step the original L and D turn gray (a gray
  // copy cross-fades in) and lose their labels; the new L, D carry them.
  vL.update(AC[0], AC[1], uL[0], uL[1], L0 * f2); op(vL, 1 - f8);
  vLg.update(AC[0], AC[1], uL[0], uL[1], L0 * f2); op(vLg, f8);
  lL.update(AC[0] + uL[0] * L0 * f2 - 26, AC[1] + uL[1] * L0 * f2 + 6, sym("L")); op(lL, f2 * (1 - f8));

  // Projection on the vertical, equal and opposite to W (step 3 only).
  const pv = f3 * (1 - f4);
  const Lx = AC[0] + uL[0] * L0, Ly = AC[1] + uL[1] * L0;
  projV.update(AC[0], AC[1], 0, -1, L0 * Math.cos(ALPHA) * f3); op(projV, pv);
  projH.setAttribute("x1", Lx); projH.setAttribute("y1", Ly); projH.setAttribute("x2", AC[0]); projH.setAttribute("y2", Ly); op(projH, pv);
  op(callout, pv);

  // Moment arms (with their force) once the equation is on screen.
  const fL = foot(CG, AC, uL), fD = foot(CG, AC, uD);
  // Arm labels placed explicitly so they clear each other and the T / D
  // labels: d_L on the open fuselage left of the lift arrow, d_D high
  // beside its (near-vertical) arm.
  dL.update(CG[0], CG[1], fL[0], fL[1], sym("d", "c.g.,L"), [fL[0] - 7, fL[1] + 6]); dL.setOpacity(f4 * (1 - 0.5 * f5));
  dD.update(CG[0], CG[1], fD[0], fD[1], sym("d", "c.g.,D"), [Math.max(CG[0], fD[0]) + 14, CG[1] + 30]); dD.setOpacity(f5 * (1 - 0.5 * f6));

  // Drag (step 5).
  vD.update(AC[0], AC[1], uD[0], uD[1], D0 * f5); op(vD, 1 - f8);
  vDg.update(AC[0], AC[1], uD[0], uD[1], D0 * f5); op(vDg, f8);
  lD.update(AC[0] + uD[0] * D0 * f5 + 8, AC[1] + uD[1] * D0 * f5 + 6, sym("D")); op(lD, f5 * (1 - f8));

  // Pitching moment about the wing a.c. (step 6): nose-down for this
  // cambered section = counter-clockwise on screen (nose left).
  mAC.update(AC[0], AC[1], 24, -0.15 * Math.PI, -1.45 * Math.PI * f6); op(mAC, f6);
  lM.update(AC[0] - 64, AC[1] + 30, sym("M", "ac")); op(lM, f6);

  // Engine + thrust along the nacelle axis (step 7).
  op(engineG, f7);
  vT.update(THR[0], THR[1], -1, 0, T0 * f7); op(vT, f7);
  lT.update(THR[0] - T0 * f7 * 0.62, THR[1] - 9, sym("T")); op(lT, f7);
  dT.update(CG[0] + 46, CG[1], CG[0] + 46, THR[1], sym("d", "c.g.,T"), [CG[0] + 54, (CG[1] + THR[1]) / 2 + 6]); dT.setOpacity(f7 * (1 - 0.5 * f8));

  // Flap (step 8): deflect 20 deg (trailing edge down), new larger and
  // slightly rotated L and D, and L_delta_f from the old lift tip to the new one.
  flapG.deflect(20 * f8);
  const uL2 = rot(uL, -4 * D2R * f8), uD2 = rot(uD, -3 * D2R * f8);
  const L2 = L0 * (1 + 0.3 * f8), D2 = D0 * (1 + 0.45 * f8);
  vL2.update(AC[0], AC[1], uL2[0], uL2[1], L2); op(vL2, f8);
  vD2.update(AC[0], AC[1], uD2[0], uD2[1], D2); op(vD2, f8);
  const t1 = [AC[0] + uL[0] * L0, AC[1] + uL[1] * L0], t2 = [AC[0] + uL2[0] * L2, AC[1] + uL2[1] * L2];
  const dx = t2[0] - t1[0], dy = t2[1] - t1[1], dlen = Math.hypot(dx, dy);
  vLd.update(t1[0], t1[1], dx / (dlen || 1), dy / (dlen || 1), dlen * clamp01(f8 * 1.2)); op(vLd, f8);
  lL2.update(t2[0] - 24, t2[1] - 2, sym("L")); op(lL2, f8);
  lLd.update(t1[0] + dx / 2 + 12, t1[1] + dy / 2 + 10, sym("L", sub("δ", "f"))); op(lLd, f8);
  lD2.update(AC[0] + uD2[0] * D2 + 8, AC[1] + uD2[1] * D2 + 6, sym("D")); op(lD2, f8);

  // Discussion callouts: the question (step 9), then the thrust note (10).
  op(note1, f9 * (1 - f10));
  op(note2, f10);
}

runSteps(render, 10);
</script>
</body>
</html>
