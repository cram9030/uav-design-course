<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Placement and Pitch-Up</title>
<!-- SOURCE for lectures/06-longitudinal-stability/media/interactive/max-engine.html.
     Lecture 06, "Why does it matter?": why the 737 MAX's engine placement
     added a nose-up pitching moment at high angle of attack. A schematic
     narrow-body airliner (drawn for this slide, not traced), nose left.
       step 0  NG-style engine: under the wing
       step 1  MAX-style engine: larger, further forward and higher (shift
               exaggerated); dashed ghost of the old position
       step 2  the aircraft pitches to high alpha; the nacelle's lift acts
               ahead of the c.g. -> extra nose-up moment (red arc); the
               C_M-alpha panel shows the curve bending up at high alpha
       step 3  automatic nose-down stabilizer trim (MCAS): stabilizer
               leading edge up, more tail lift, nose-down moment (green
               arc); the curve is brought back to the expected trend
     The C_M-alpha curves are schematic (shape only, no data). Plays
     backward when stepping back. Standalone: arrow keys or ?step=N.
     After editing, rebuild the self-contained copy the slide embeds:
       uv run python scripts/bundle_interactive.py \
         lectures/06-longitudinal-stability/code/interactive/max-engine.html \
         lectures/06-longitudinal-stability/media/interactive/max-engine.html -->
<script src="../../../../assets/js/anim-steps.js"></script>
<link rel="stylesheet" href="./force-diagram.css">
<style>
  .caption { font-size: 23px; font-weight: 600; fill: #1f2a36; }
  .small { font-size: 16px; fill: #5a6b7d; }
  .axis { stroke: #1f2a36; stroke-width: 1.8; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1000 470" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Larger, forward-mounted engines add a nose-up pitching moment at high angle of attack"></svg>
<script src="../../../../assets/js/interactive-errors.js"></script>
<script type="module">
import { el, vector, momentArc, label, sym, ease, clamp01 } from "../../../../assets/js/aircraft2d/svg-draw.js";
import { naca4 } from "../../../../assets/js/aircraft2d/jet-profile.js";
import { runSteps, op, COLORS } from "./force-diagram.js";

const stage = document.getElementById("stage");
const D2R = Math.PI / 180;
const RED = "#c0392b", GREEN = "#2a9d3a", GRAY = "#8795a3";

// ---- aircraft geometry (metres; x aft from the nose, y up) ------------------------
const S = 14.5, CGM = [15.6, -0.4], CGS = [292, 290];          // c.g. in metres and on screen
const P = ([x, y]) => [(x - CGM[0]) * S, -(y - CGM[1]) * S];    // body metres -> body-screen (c.g. at 0,0)
const smooth = (pts) => {                                       // closed Catmull-Rom -> cubic Beziers
  const q = pts.map(P), n = q.length;
  let d = `M${q[0][0].toFixed(1)},${q[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p0 = q[(i - 1 + n) % n], p1 = q[i], p2 = q[(i + 1) % n], p3 = q[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1.map((v) => v.toFixed(1))} ${c2.map((v) => v.toFixed(1))} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + "Z";
};
const poly = (pts) => "M" + pts.map(P).map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join("L") + "Z";
const FUSELAGE = [
  [0, -0.25], [0.5, 0.65], [1.6, 1.3], [3.2, 1.72], [5.5, 1.88], [29, 1.88], [34, 1.7], [37.5, 1.4], [39.5, 1.05],
  [39.5, 0.55], [36, -0.15], [32, -1.0], [28.5, -1.7], [25, -1.88], [6, -1.88], [3.2, -1.65], [1.3, -1.15], [0.35, -0.65],
];
const FIN = [[29.5, 1.86], [35.6, 7.6], [38, 7.6], [39.3, 1.3]];
const WINDSHIELD = [[1.75, 0.95], [2.5, 1.4], [3.7, 1.55], [3.6, 0.95]];
const section = (code, le, chord, y) => poly(naca4(code, 30).map(([xc, yc]) => [le + xc * chord, y + yc * chord]));
const WING = { le: 13.6, chord: 5.2, y: -1.55 };
const STAB = { le: 35.2, chord: 3.0, y: 0.75, pivot: [37.3, 0.75] };

// Engine: nacelle (inlet lip, body tapering to the nozzle) + pylon to the wing.
function nacellePath(cx, cy, len, dia) {
  const r = dia / 2;
  const pts = [[cx - len / 2, cy + r * 0.92], [cx - len / 2 + 0.25, cy + r], [cx + len * 0.22, cy + r * 0.98],
               [cx + len / 2, cy + r * 0.62], [cx + len / 2 + 0.5, cy + r * 0.3], [cx + len / 2 + 0.5, cy - r * 0.3],
               [cx + len / 2, cy - r * 0.62], [cx + len * 0.22, cy - r * 0.98], [cx - len / 2 + 0.25, cy - r], [cx - len / 2, cy - r * 0.92]];
  return pts;
}
const ENG = {                                                  // [cx, cy, len, dia]
  ng: [12.9, -2.85, 3.7, 1.75],
  max: [11.6, -2.45, 4.1, 2.1],                                // forward and higher (exaggerated), larger fan
};

// ---- scene ------------------------------------------------------------------------
const world = el("g", {}, stage);
const windG = el("g", {}, stage);
const body = el("g", {}, world);                               // rotated by alpha about the c.g.
el("path", { d: poly(FIN), class: "skin" }, body);
el("path", { d: smooth(FUSELAGE), class: "skin" }, body);
el("path", { d: poly(WINDSHIELD), class: "glass" }, body);
for (let i = 0; i < 16; i++) { const [x, y] = P([7 + i * 1.35, 0.75]); el("rect", { x: x - 2.5, y: y - 4, width: 5, height: 7, rx: 1.5, class: "glass" }, body); }
el("path", { d: section("2412", WING.le, WING.chord, WING.y), class: "section" }, body);
const stabG = el("g", {}, body);
el("path", { d: section("0012", STAB.le, STAB.chord, STAB.y), class: "flap" }, stabG);
const pivotS = P(STAB.pivot);
const ghost = el("path", { fill: "none", stroke: GRAY, "stroke-width": 1.6, "stroke-dasharray": "5 4" }, body);
ghost.setAttribute("d", smooth(nacellePath(...ENG.ng)));
const pylon = el("path", { class: "skin" }, body);
const nacelle = el("path", { class: "engine" }, body);
const inlet = el("ellipse", { fill: "#3d4b59" }, body);
const cgG = el("g", {}, stage);
el("circle", { r: 7, fill: "#fff", stroke: "#111", "stroke-width": 1.4 }, cgG);
el("path", { d: "M0,0 L7,0 A7,7 0 0,1 0,7 Z M0,0 L-7,0 A7,7 0 0,1 0,-7 Z", fill: "#111" }, cgG);
cgG.setAttribute("transform", `translate(${CGS[0]} ${CGS[1]})`);
const fx = el("g", {}, stage);
const vNac = vector(fx, { color: RED, width: 3.2, head: 13 });
const lNac = label(fx, { color: RED, size: 18, anchor: "end" });
const vTail = vector(fx, { color: GREEN, width: 3.2, head: 13 });
const lTail = label(fx, { color: GREEN, size: 18 });
const haloUp = el("path", { fill: "none", stroke: "#fff", "stroke-width": 9, "stroke-linecap": "round" }, fx);
const arcUp = momentArc(fx, { color: RED, width: 3.6, head: 14 });
const haloDn = el("path", { fill: "none", stroke: "#fff", "stroke-width": 9, "stroke-linecap": "round" }, fx);
const arcDn = momentArc(fx, { color: GREEN, width: 3.6, head: 14 });

// Relative wind (horizontal) with the alpha arc drawn against the body axis.
el("line", { x1: 18, y1: 420, x2: 112, y2: 420, stroke: COLORS.V, "stroke-width": 3 }, windG);
el("polygon", { points: "126,420 111,414 111,426", fill: COLORS.V }, windG);
label(windG, { size: 18, color: COLORS.V }).update(40, 450, sym("V", "∞"));

// Caption (top left), cross-faded per step.
const CAPS = [
  "737 NG: engine slung under the wing",
  "737 MAX: larger engine, further forward and higher",
  "High α: nacelle lift ahead of the c.g. → extra nose-up moment",
  "MCAS trims the stabilizer nose-down to compensate",
];
const caps = CAPS.map((t) => { const n = el("text", { x: 14, y: 34, class: "caption" }, stage); n.textContent = t; return n; });
const note = el("text", { x: 14, y: 58, class: "small" }, stage);
note.textContent = "schematic; engine shift exaggerated";

// ---- C_M-alpha panel (right), schematic ------------------------------------------
const panel = el("g", {}, stage);
const PX0 = 715, PX1 = 985, PY0 = 110, PY1 = 400, AXY = 230;
const aToX = (a) => PX0 + (a / 16) * (PX1 - PX0);
const cmToY = (c) => AXY - c * 260;
el("line", { x1: PX0, y1: PY1, x2: PX0, y2: PY0 + 8, class: "axis" }, panel);
el("polygon", { points: `${PX0},${PY0 - 6} ${PX0 - 6},${PY0 + 10} ${PX0 + 6},${PY0 + 10}`, fill: "#1f2a36" }, panel);
el("line", { x1: PX0, y1: AXY, x2: PX1 - 6, y2: AXY, class: "axis" }, panel);
el("polygon", { points: `${PX1 + 8},${AXY} ${PX1 - 8},${AXY - 6} ${PX1 - 8},${AXY + 6}`, fill: "#1f2a36" }, panel);
label(panel, { size: 20 }).update(PX0 + 10, PY0 + 6, sym("C", "M"));
label(panel, { size: 20, anchor: "end" }).update(PX1 + 6, AXY - 10, sym("α"));
const lin = (a) => 0.2 - 0.04 * a;                             // expected: linear, stable
const pitchUp = (a) => 0.0015 * Math.max(0, a - 8) ** 2.2;     // nacelle lift at high alpha: the slope flattens toward zero
const curve = (fn) => { let d = ""; for (let a = 0; a <= 16; a += 0.25) d += (d ? "L" : "M") + aToX(a).toFixed(1) + "," + cmToY(fn(a)).toFixed(1); return d; };
el("path", { d: curve(lin), fill: "none", stroke: GRAY, "stroke-width": 2.4, "stroke-dasharray": "7 5" }, panel);
const maxCurve = el("path", { fill: "none", stroke: RED, "stroke-width": 2.8 }, panel);
const dot = el("circle", { r: 7, fill: "#1f2a36" }, panel);
const leg = el("g", {}, panel);
const legend = [[GRAY, "expected (linear)", "7 5"], [RED, "with nacelle lift", null], [GREEN, "with MCAS trim", null]].map(([c, t, dash], i) => {
  const g = el("g", { transform: `translate(${PX0 + 10} ${PY1 + 22 + i * 0})` }, leg);
  return { c, t, dash, g };
});
// Legend laid out in a row under the plot would not fit; stack it at the right of the axis top.
legend.forEach((L, i) => {
  L.g.setAttribute("transform", `translate(${PX0 + 70} ${PY0 - 52 + Math.min(i, 1) * 22})`);
  el("line", { x1: 0, y1: -5, x2: 26, y2: -5, stroke: L.c, "stroke-width": 2.6, ...(L.dash ? { "stroke-dasharray": L.dash } : {}) }, L.g);
  const t = el("text", { x: 32, y: 0, class: "small" }, L.g); t.textContent = L.t;
});
const legRed = legend[1].g, legGreen = legend[2].g;

// ---- render -----------------------------------------------------------------------
const lerp = (a, b, t) => a + (b - a) * t;
const rotPt = ([x, y], th) => [CGS[0] + x * Math.cos(th) - y * Math.sin(th), CGS[1] + x * Math.sin(th) + y * Math.cos(th)];
function render(pos) {
  const f1 = ease(clamp01(pos)), f2 = ease(clamp01(pos - 1)), f3 = ease(clamp01(pos - 2));
  caps.forEach((n, i) => op(n, clamp01(1 - Math.abs(pos - i) * 2)));
  op(note, f1);

  // Engine moves from the NG to the MAX position and grows.
  const e = ENG.ng.map((v, i) => lerp(v, ENG.max[i], f1));
  nacelle.setAttribute("d", smooth(nacellePath(...e)));
  const [ix, iy] = P([e[0] - e[2] / 2 + 0.05, e[1]]);
  inlet.setAttribute("cx", ix); inlet.setAttribute("cy", iy); inlet.setAttribute("rx", 3.5); inlet.setAttribute("ry", e[3] / 2 * S * 0.86);
  const top = e[1] + e[3] / 2;
  pylon.setAttribute("d", poly([[e[0] - 0.6, top - 0.15], [WING.le + 0.35, WING.y - 0.08], [WING.le + 2.6, WING.y - 0.2], [e[0] + e[2] / 2 - 0.2, top - 0.15]]));
  op(ghost, f1 * (1 - f2));

  // Pitch to high alpha; stabilizer trim nose-down (leading edge up).
  const alpha = lerp(2, 13, f2), th = alpha * D2R;
  body.setAttribute("transform", `translate(${CGS[0]} ${CGS[1]}) rotate(${alpha})`);
  stabG.setAttribute("transform", `rotate(${5 * f3} ${pivotS[0]} ${pivotS[1]})`);

  // Nacelle lift (up, perpendicular to the wind) and its nose-up moment.
  const nc = rotPt(P([e[0], e[1]]), th);
  const Ln = 92 * f2;
  vNac.update(nc[0], nc[1] - 4, 0, -1, Ln); op(vNac, f2);
  lNac.update(nc[0] - 8, nc[1] - Ln + 12, sym("L", "nacelle")); op(lNac, f2);
  const sUp = 1.05 * Math.PI * f2;
  arcUp.update(CGS[0], CGS[1], 44, -Math.PI / 2 - sUp / 2, sUp); op(arcUp, f2);
  const dUp = arcUp.querySelector("path").getAttribute("d"); if (dUp) haloUp.setAttribute("d", dUp); op(haloUp, f2);
  // Trim: more tail lift behind the c.g., nose-down moment.
  const tc = rotPt(P([STAB.le + STAB.chord * 0.25, STAB.y + 0.3]), th);
  const Lt = 80 * f3;
  vTail.update(tc[0], tc[1] - 4, 0, -1, Lt); op(vTail, f3);
  lTail.update(tc[0] + 10, tc[1] - Lt * 0.6, sym("ΔL", "t")); op(lTail, f3);
  const sDn = -1.05 * Math.PI * f3;
  arcDn.update(CGS[0], CGS[1], 64, -Math.PI / 2 - sDn / 2, sDn); op(arcDn, f3);
  const dDn = arcDn.querySelector("path").getAttribute("d"); if (dDn) haloDn.setAttribute("d", dDn); op(haloDn, f3);

  // C_M-alpha panel: appears with the pitch-up; the curve bends up, then MCAS
  // brings it back to the expected line.
  op(panel, clamp01(pos - 1) > 0 ? Math.min(1, clamp01(pos - 1) * 3) : 0);
  maxCurve.setAttribute("d", curve((a) => lin(a) + pitchUp(a) * (1 - f3)));
  maxCurve.setAttribute("stroke", f3 > 0.5 ? GREEN : RED);
  dot.setAttribute("cx", aToX(alpha)); dot.setAttribute("cy", cmToY(lin(alpha) + pitchUp(alpha) * (1 - f3)));
  op(legRed, 1 - f3); op(legGreen, f3);
}

runSteps(render, 3);
</script>
</body>
</html>
